# NewsBot - runs every 30 minutes on GitHub's free runners (public repo = unlimited minutes)
name: NewsBot

on:
  schedule:
    # Minutes 7 and 37 instead of :00/:30 - GitHub delays jobs queued on the hour.
    - cron: "7,37 * * * *"
  workflow_dispatch:            # "Run workflow" button for manual runs
  push:                         # rebuild when you change the design/code
    branches: [main]
    paths: ["templates/**", "static/**", "bot/**", "config.py", "main.py"]

permissions:
  contents: write    # commit data/articles.json back to the repo
  pages: write       # deploy to GitHub Pages
  id-token: write

concurrency:
  group: newsbot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, rewrite, build
        env:
          # ---- site ----
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          SITE_TAGLINE: ${{ vars.SITE_TAGLINE }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          PUBLISH_TARGET: ${{ vars.PUBLISH_TARGET || 'static' }}
          # ---- free LLM keys (optional; first one set is used) ----
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # ---- WordPress (optional) ----
          WP_URL: ${{ vars.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          # ---- Adsterra codes (public anyway, so Variables not Secrets) ----
          ADSTERRA_HEADER_728: ${{ vars.ADSTERRA_HEADER_728 }}
          ADSTERRA_HEADER_320: ${{ vars.ADSTERRA_HEADER_320 }}
          ADSTERRA_RECT_300: ${{ vars.ADSTERRA_RECT_300 }}
          ADSTERRA_SKY_160: ${{ vars.ADSTERRA_SKY_160 }}
          ADSTERRA_NATIVE: ${{ vars.ADSTERRA_NATIVE }}
          ADSTERRA_SOCIAL_BAR: ${{ vars.ADSTERRA_SOCIAL_BAR }}
          ADSTERRA_POPUNDER: ${{ vars.ADSTERRA_POPUNDER }}
          ADSTERRA_STICKY_728: ${{ vars.ADSTERRA_STICKY_728 }}
          ADSTERRA_STICKY_320: ${{ vars.ADSTERRA_STICKY_320 }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python main.py --build-only
          else
            python main.py
          fi

      - name: Commit new articles
        run: |
          git config user.name  "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          # Merge with whatever is on main right now (another run may have
          # pushed meanwhile) by combining article lists - never a git conflict.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git show origin/main:data/articles.json > /tmp/remote.json
            python -m bot.merge data/articles.json /tmp/remote.json
            git reset -q origin/main
            git add data/articles.json
            if git diff --cached --quiet; then echo "No new articles"; break; fi
            git commit -q -m "news: $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push -q origin HEAD:main; then echo "Pushed"; break; fi
            echo "Push raced with another run, retrying ($attempt)"; sleep 5
          done

      - uses: actions/upload-pages-artifact@v3
        if: ${{ (vars.PUBLISH_TARGET || 'static') != 'wordpress' }}
        with:
          path: public

  deploy:
    needs: build
    if: ${{ (vars.PUBLISH_TARGET || 'static') != 'wordpress' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Facebook Page auto-post. DRY RUN (logs only) until the repo Variable
  # FB_ENABLED is "true" and FB_PAGE_ID + the FB_PAGE_TOKEN Secret exist.
  # Runs after deploy so the article page is live before Facebook scrapes it.
  facebook:
    needs: deploy
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # include the articles just committed by the build job

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Post to Facebook Page
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          FB_ENABLED: ${{ vars.FB_ENABLED }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_MAX_PER_RUN: ${{ vars.FB_MAX_PER_RUN || '1' }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          git config user.name  "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          python -m bot.facebook

  # Search-engine pings (IndexNow) + Bluesky/Telegram posts. Social posting is
  # skipped automatically unless BSKY_* / TG_* secrets exist.
  distribute:
    needs: deploy
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: IndexNow + social
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BSKY_HANDLE: ${{ vars.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          ADSTERRA_DIRECT: ${{ vars.ADSTERRA_DIRECT }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
        run: |
          python -m bot.indexnow || true
          python -m bot.social || true
          python -m bot.newsletter || true
          git config user.name  "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          mkdir -p /tmp/rec
          cp data/indexnow.json data/social_posted.json data/newsletter.json /tmp/rec/ 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/rec/* data/ 2>/dev/null || true
            git add data/indexnow.json data/social_posted.json data/newsletter.json 2>/dev/null || true
            if git diff --cached --quiet; then echo "nothing to record"; break; fi
            git commit -q -m "distribute: $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push -q origin HEAD:main; then echo "Pushed"; break; fi
            echo "push raced, retry $attempt"; sleep 5
          done
